<!doctype html>
<html lang="es" data-theme="light" data-palette="avatar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avatar · demo inicio</title>
<meta name="robots" content="noindex">
<script type="importmap">{ "imports": { "@avatar/vendor": "https://api-avatar.jeffaporta.workers.dev/avatar.js?v=242cb962" } }</script>
<script src="../../../dist/cdn/boot.js"></script>
<link rel="stylesheet" href="../../../dist/cdn/styles/app.css">
<script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@a1df39adb9e421de874dd624901b72daa9e25e5c/dist/cdn/core/loader.min.js"></script>
<script type="module" src="../../../dist/cdn/avLoader.min.js"></script>
<style>body { padding: 1rem; } section { margin-block: 1rem; }</style>
<script type="module">
  // Demo de la vista: cada sub-pieza aislada con datos de muestra (la galería completa está en /view/demo/).
  const L = globalThis.iswcLoader;
  const listo = () => document.documentElement.setAttribute('data-app-ready', '');
  const watchdog = setTimeout(listo, 6000);
  try {
    await L.loadPageStyles(['iswc-palettes-default']);
    const { KIT_TAGS, APP_TAGS, VIEW_TAGS } = await import('../../../dist/cdn/js/kit-tags.js');
    await L.load(...KIT_TAGS, ...APP_TAGS, ...VIEW_TAGS.inicio);
  } finally {
    clearTimeout(watchdog);
    listo();
  }
</script>
</head>
<body>
  <p>Demo de la vista <code>inicio</code>: usa la <a href="../../demo/#av-inicio">galería</a> para cada pieza con su playground.</p>
  <section><av-inicio></av-inicio></section>
</body>
</html>
